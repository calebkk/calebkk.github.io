<section id="projects" class="py-20 px-4 sm:px-6 lg:px-8">
  <div class="max-w-6xl mx-auto">
    <!-- Header -->
    <div @fadeInUp>
      <h2 class="mb-4 text-center">
        Featured <span class="text-[var(--color-primary)]">Projects</span>
      </h2>
      <div class="w-20 h-1 bg-[var(--color-primary)] mx-auto mb-12"></div>
    </div>

    <!-- Projects Grid -->
    <div
      class="grid md:grid-cols-2 gap-6"
      @container
    >
      <div
        *ngFor="let project of projects"
        class="project-card group bg-[var(--color-surface)] rounded-xl border
               border-[var(--color-border)] overflow-hidden
               hover:border-[var(--color-primary)]
               hover:shadow-xl hover:shadow-[var(--color-primary)]/20
               transition-all duration-300
               hover:-translate-y-2 hover:scale-[1.03]"
      >
        <!-- Image -->
        <div class="relative overflow-hidden aspect-video">
          <img
            [src]="project.image"
            [alt]="project.title"
            appImageFallback
            class="w-full h-full object-cover
                   group-hover:scale-110 transition-transform duration-500"
          />
          <div
            class="absolute inset-0 bg-gradient-to-t
                   from-[var(--color-background)] to-transparent opacity-60"
          ></div>
        </div>

        <!-- Content -->
        <div class="p-6">
          <h3 class="mb-3">{{ project.title }}</h3>

          <p class="mb-4 text-[var(--color-text-secondary)]">
            {{ project.description }}
          </p>

          <!-- Tags -->
          <div class="flex flex-wrap gap-2 mb-6">
            <span
              *ngFor="let tag of project.tags"
              @tag
              class="px-3 py-1 bg-[var(--color-surface-elevated)]
                     text-[var(--color-accent)] rounded-full
                     hover:scale-110 transition-transform"
            >
              {{ tag }}
            </span>
          </div>

          <!-- Links -->
          <div class="flex items-center gap-4">
            <a
              [href]="project.github"
              target="_blank"
              rel="noopener"
              class="flex items-center gap-2
                     text-[var(--color-text-secondary)]
                     hover:text-[var(--color-primary)]
                     transition-all hover:translate-x-1"
            >
              <lucide-icon name="github" size="18"></lucide-icon>
              <span>Code</span>
            </a>

            <a
              [href]="project.demo"
              target="_blank"
              rel="noopener"
              class="flex items-center gap-2
                     text-[var(--color-text-secondary)]
                     hover:text-[var(--color-primary)]
                     transition-all hover:translate-x-1"
            >
              <lucide-icon name="external-link" size="18"></lucide-icon>
              <span>Demo</span>
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
